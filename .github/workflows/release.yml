name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS x64
            platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: Windows x64
            platform: windows-latest
            rust_target: ""
            args: ""
          - label: Linux x64
            platform: ubuntu-22.04
            rust_target: ""
            args: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            NOTES="$(git log "${PREV_TAG}..${TAG}" --no-merges --pretty=format:"- %s" | head -n 40)"
          else
            NOTES="$(git log "${TAG}" --no-merges --pretty=format:"- %s" -n 20)"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="See the assets to download and install this version."
          fi
          {
            echo "RELEASE_BODY<<__TOKSCALE_RELEASE_EOF__"
            printf '%s\n' "$NOTES"
            echo "__TOKSCALE_RELEASE_EOF__"
          } >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Tokscale UI v__VERSION__
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          retryAttempts: 3
          args: ${{ matrix.args }}

      - name: Verify macOS ad-hoc bundle signature
        if: matrix.platform == 'macos-latest'
        run: |
          codesign --verify --deep --strict "src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/Tokscale UI.app"

  verify-release:
    name: Verify Updater Manifest (latest.json)
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download and validate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(jq -r '.version' src-tauri/tauri.conf.json)"
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --pattern "latest.json" --clobber

          jq -e '
            (.version | type == "string" and length > 0) and
            (.notes | type == "string") and
            (.pub_date | type == "string" and length > 0) and
            (.platforms | type == "object")
          ' latest.json >/dev/null

          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            jq -e --arg p "$platform" '
              .platforms[$p] != null and
              (.platforms[$p].signature | type == "string" and length > 0) and
              (.platforms[$p].url | type == "string" and length > 0)
            ' latest.json >/dev/null || {
              echo "ERROR: Missing or incomplete platform entry in latest.json: $platform"
              cat latest.json
              exit 1
            }
          done

          echo "Verified latest.json contains all 4 required platform entries."

      - name: Generate and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(jq -r '.version' src-tauri/tauri.conf.json)"
          mkdir -p checksum-assets
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --dir checksum-assets --clobber
          (
            cd checksum-assets
            rm -f latest.json SHA256SUMS.txt *.sig
            sha256sum * > ../SHA256SUMS.txt
          )
          gh release upload "$TAG" SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
          cat SHA256SUMS.txt

  publish-package-managers:
    name: Update Homebrew Tap & Scoop Bucket
    needs: verify-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Update Homebrew tap cask (optional)
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'munim/homebrew-tap' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"
          TAG="v${VERSION}"
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --pattern "SHA256SUMS.txt" --clobber
          ARM_SHA="$(awk '/aarch64.*\.dmg$/ {print $1; exit}' SHA256SUMS.txt)"
          INTEL_SHA="$(awk '/x64.*\.dmg$/ {print $1; exit}' SHA256SUMS.txt)"
          ARM_FILE="$(awk '/aarch64.*\.dmg$/ {print $2; exit}' SHA256SUMS.txt)"
          INTEL_FILE="$(awk '/x64.*\.dmg$/ {print $2; exit}' SHA256SUMS.txt)"
          if [ -z "$ARM_SHA" ] || [ -z "$INTEL_SHA" ]; then
            echo "Could not locate macOS DMG checksums in SHA256SUMS.txt"
            exit 1
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap-repo
          mkdir -p tap-repo/Casks
          cat > tap-repo/Casks/tokscale-ui.rb <<EOF
cask "tokscale-ui" do
  arch arm: "${ARM_FILE}", intel: "${INTEL_FILE}"

  version "${VERSION}"
  sha256 arm:   "${ARM_SHA}",
         intel: "${INTEL_SHA}"

  url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/#{arch}"
  name "Tokscale UI"
  desc "Desktop and menubar companion for tokscale"
  homepage "https://github.com/${GITHUB_REPOSITORY}"

  auto_updates true
  depends_on macos: ">= :big_sur"

  app "Tokscale UI.app"

  postflight_steps do
    run "/usr/bin/xattr",
        args:           ["-dr", "com.apple.quarantine", "{{appdir}}/Tokscale UI.app"],
        writable_paths: ["{{appdir}}/Tokscale UI.app"]
  end
end
EOF
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tokscale-ui.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(cask): bump tokscale-ui to ${VERSION}"
            git push
          fi

      - name: Update Scoop bucket manifest (optional)
        env:
          BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO || 'munim/scoop-bucket' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: env.BUCKET_TOKEN != ''
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"
          TAG="v${VERSION}"
          gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --pattern "SHA256SUMS.txt" --clobber
          WIN_SHA="$(awk '/-setup\.exe$/ {print $1; exit}' SHA256SUMS.txt)"
          WIN_FILE="$(awk '/-setup\.exe$/ {print $2; exit}' SHA256SUMS.txt)"
          if [ -z "$WIN_SHA" ] || [ -z "$WIN_FILE" ]; then
            echo "Could not locate Windows setup.exe checksum in SHA256SUMS.txt"
            exit 1
          fi
          git clone "https://x-access-token:${BUCKET_TOKEN}@github.com/${BUCKET_REPO}.git" bucket-repo
          mkdir -p bucket-repo/bucket
          jq -n \
            --arg version "$VERSION" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${WIN_FILE}" \
            --arg hash "$WIN_SHA" \
            --arg repo "${GITHUB_REPOSITORY}" \
            '{
              version: $version,
              description: "Desktop and menubar companion for tokscale",
              homepage: ("https://github.com/" + $repo),
              license: "MIT",
              architecture: {
                "64bit": {
                  url: $url,
                  hash: $hash
                }
              },
              installer: {
                script: "Start-Process -Wait -FilePath \"$dir\\$fname\" -ArgumentList \"/S\",\"/D=$dir\""
              },
              uninstaller: {
                script: "if (Test-Path \"$dir\\uninstall.exe\") { Start-Process -Wait -FilePath \"$dir\\uninstall.exe\" -ArgumentList \"/S\" }"
              },
              bin: "Tokscale UI.exe"
            }' > bucket-repo/bucket/tokscale-ui.json
          cd bucket-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/tokscale-ui.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(scoop): bump tokscale-ui to ${VERSION}"
            git push
          fi
